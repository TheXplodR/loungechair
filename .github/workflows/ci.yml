name: Build test APK

on:
  push:
    branches:
      - '*-dev'
    paths-ignore:
      - '.idea/**'
      - '.gitattributes'
      - '.gitignore'
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:

# A newer push to the same branch cancels the build that is still running.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to publish the APK on the "test-build" release
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # Every build must be signed with the same key, otherwise Android refuses to
      # install a new build over the previous one. The key lives in the KEYSTORE
      # repository secret (base64 of a PKCS12 keystore), never in the code.
      - name: Write signing info
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'loungechair' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'loungechair' }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/key.p12"
            {
              echo "storeFile=$RUNNER_TEMP/key.p12"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEYSTORE_PASSWORD"
            } > keystore.properties
            echo "Signing with the key from the KEYSTORE secret."
          else
            echo "::warning::No KEYSTORE secret is set, so this build uses a throwaway key and cannot be installed as an update over an earlier build."
          fi

      - name: Build APK
        run: ./gradlew assembleLawnWithQuickstepGithubDebug

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: test-apk
          path: build/outputs/apk/**/*.apk
          retention-days: 14

      # Replaces the "test-build" pre-release so the newest APK is always one tap
      # away on the repository's Releases page.
      - name: Publish APK on the test-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(find build/outputs/apk -name '*.apk' | head -n 1)
          name="Loungechair-test-${{ github.run_number }}-${GITHUB_SHA::7}.apk"
          cp "$apk" "$name"
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build "$name" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Test build ${{ github.run_number }}" \
            --notes "Built from ${{ github.ref_name }} at ${GITHUB_SHA::7}. Install the .apk below on your phone."
